[package]
name = "signal-cli-rust"
version = "0.1.0"
edition = "2021"
description = "A lightweight Signal CLI in Rust with MCP support"
license = "AGPL-3.0-only"

[[bin]]
name = "signal-cli"
path = "src/main.rs"

[[bin]]
name = "signal-mcp"
path = "src/mcp_main.rs"

[features]
default = ["cdsi"]
cdsi = ["presage/cdsi"]

[dependencies]
presage = { git = "https://github.com/whisperfish/presage.git", default-features = false, features = ["cdsi"] }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage.git" }

anyhow = { version = "1.0", features = ["backtrace"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
clap = { version = "4", features = ["derive"] }
directories = "6.0"
futures = "0.3"
hex = "0.4"
mime_guess = "2.0"
qr2term = "0.3"
qrcode = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[patch.crates-io]
curve25519-dalek = { git = 'https://github.com/signalapp/curve25519-dalek', tag = 'signal-curve25519-4.1.3' }
quickcheck_async = { git = 'https://github.com/nytopop/quickcheck_async', rev = '76b13525ca93e0725e757f841fc6ccab8bae1913' }
libsqlite3-sys = { version = "0.36.0", git = "https://github.com/whisperfish/rusqlite", rev = '2a42b3354c9194700d08aa070f70a131a470e7dc' }

[package.metadata.deb]
maintainer = "didhd"
section = "net"
priority = "optional"
assets = [
    ["target/release/signal-cli", "usr/bin/", "755"],
    ["target/release/signal-mcp", "usr/bin/", "755"],
]
extended-description = "A lightweight, cross-platform Signal messenger CLI built on libsignal/presage with MCP server support for AI integration."

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/signal-cli", dest = "/usr/bin/signal-cli", mode = "755" },
    { source = "target/release/signal-mcp", dest = "/usr/bin/signal-mcp", mode = "755" },
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
