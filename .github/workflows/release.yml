name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            name: signal-cli-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: signal-cli-macos-aarch64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: signal-cli-linux-x86_64
          # Windows disabled: libsqlite3-sys/sqlcipher build fails on MSVC
          # - target: x86_64-pc-windows-msvc
          #   os: windows-latest
          #   name: signal-cli-windows-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler cmake pkg-config libssl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install protoc cmake -y

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      # --- tar.gz for all Unix ---
      - name: Package tar.gz (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/signal-cli dist/ 2>/dev/null || true
          cp target/${{ matrix.target }}/release/signal-mcp dist/ 2>/dev/null || true
          chmod +x dist/*
          cd dist && tar czf ../${{ matrix.name }}.tar.gz *

      # --- .deb package (Linux only) ---
      - name: Build .deb package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked || true
          cargo deb --target ${{ matrix.target }} --no-build --no-strip \
            || echo "cargo-deb failed, building manually"

          # Manual .deb if cargo-deb fails
          if [ ! -f target/${{ matrix.target }}/debian/*.deb ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PKG_DIR="signal-cli_${VERSION}_amd64"
            mkdir -p "${PKG_DIR}/DEBIAN"
            mkdir -p "${PKG_DIR}/usr/bin"
            cp target/${{ matrix.target }}/release/signal-cli "${PKG_DIR}/usr/bin/"
            cp target/${{ matrix.target }}/release/signal-mcp "${PKG_DIR}/usr/bin/"
            cat > "${PKG_DIR}/DEBIAN/control" << EOF
          Package: signal-cli
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: foxl-ai
          Description: Lightweight Signal CLI in Rust with MCP support
           A cross-platform Signal messenger CLI built on libsignal/presage.
          EOF
            dpkg-deb --build "${PKG_DIR}"
            mv "${PKG_DIR}.deb" "signal-cli_${VERSION}_amd64.deb"
          fi

      # --- .rpm package (Linux only) ---
      - name: Build .rpm package
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked || true
          cargo generate-rpm --target ${{ matrix.target }} \
            || echo "cargo-generate-rpm not configured, building manually"

          if [ ! -f target/${{ matrix.target }}/generate-rpm/*.rpm ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            sudo apt-get install -y rpm
            mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
            mkdir -p rpmbuild/BUILD/usr/bin
            cp target/${{ matrix.target }}/release/signal-cli rpmbuild/BUILD/usr/bin/
            cp target/${{ matrix.target }}/release/signal-mcp rpmbuild/BUILD/usr/bin/
            cat > rpmbuild/SPECS/signal-cli.spec << 'SPEC'
          Name: signal-cli
          Version: VERSION_PLACEHOLDER
          Release: 1
          Summary: Lightweight Signal CLI in Rust
          License: AGPL-3.0
          BuildArch: x86_64

          %description
          A cross-platform Signal messenger CLI built on libsignal/presage with MCP support.

          %install
          mkdir -p %{buildroot}/usr/bin
          cp %{_builddir}/usr/bin/signal-cli %{buildroot}/usr/bin/
          cp %{_builddir}/usr/bin/signal-mcp %{buildroot}/usr/bin/

          %files
          /usr/bin/signal-cli
          /usr/bin/signal-mcp
          SPEC
            sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" rpmbuild/SPECS/signal-cli.spec
            rpmbuild --define "_topdir $(pwd)/rpmbuild" -bb rpmbuild/SPECS/signal-cli.spec
            cp rpmbuild/RPMS/x86_64/*.rpm "signal-cli-${VERSION}.x86_64.rpm" || true
          fi

      # --- DMG (macOS only) ---
      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dmg_contents
          cp target/${{ matrix.target }}/release/signal-cli dmg_contents/
          cp target/${{ matrix.target }}/release/signal-mcp dmg_contents/
          chmod +x dmg_contents/*

          # Create install script inside DMG
          cat > dmg_contents/install.sh << 'INSTALL'
          #!/bin/bash
          set -e
          INSTALL_DIR="/usr/local/bin"
          echo "Installing signal-cli to ${INSTALL_DIR}..."
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          sudo cp "${SCRIPT_DIR}/signal-cli" "${INSTALL_DIR}/"
          sudo cp "${SCRIPT_DIR}/signal-mcp" "${INSTALL_DIR}/"
          sudo chmod +x "${INSTALL_DIR}/signal-cli" "${INSTALL_DIR}/signal-mcp"
          echo "Done! Run 'signal-cli --help' to get started."
          echo "To link with your Signal account: signal-cli link-device -n \"my-cli\""
          INSTALL
          chmod +x dmg_contents/install.sh

          hdiutil create -volname "Signal CLI" -srcfolder dmg_contents \
            -ov -format UDZO "${{ matrix.name }}.dmg"

      # --- Windows zip ---
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          Copy-Item "target/${{ matrix.target }}/release/signal-cli.exe" "dist/"
          Copy-Item "target/${{ matrix.target }}/release/signal-mcp.exe" "dist/"
          # Create install.ps1
          @'
          $InstallDir = "$env:LOCALAPPDATA\signal-cli"
          New-Item -ItemType Directory -Force -Path $InstallDir | Out-Null
          Copy-Item "signal-cli.exe" "$InstallDir\" -Force
          Copy-Item "signal-mcp.exe" "$InstallDir\" -Force
          $path = [Environment]::GetEnvironmentVariable("PATH", "User")
          if ($path -notlike "*$InstallDir*") {
              [Environment]::SetEnvironmentVariable("PATH", "$path;$InstallDir", "User")
              Write-Host "Added $InstallDir to PATH"
          }
          Write-Host "Installed! Restart your terminal, then run: signal-cli --help"
          Write-Host "To link with Signal: signal-cli link-device -n 'my-cli'"
          '@ | Out-File -FilePath "dist\install.ps1" -Encoding utf8
          Compress-Archive -Path dist/* -DestinationPath "${{ matrix.name }}.zip"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip
            ${{ matrix.name }}.dmg
            *.deb
            *.rpm

  release:
    needs: build
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.dmg
            artifacts/**/*.deb
            artifacts/**/*.rpm
